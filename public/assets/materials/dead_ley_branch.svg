<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="leyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Gnarled Branch Path -->
  <path d="M 24 104 C 40 90 48 68 56 48 C 62 34 76 22 96 16 C 98 22 94 28 88 32 C 78 38 68 52 64 68 C 60 84 46 106 32 112 Z" fill="url(#bark)" stroke="#92400e" stroke-width="2.5"/>
  <!-- Branch fork -->
  <path d="M 58 54 C 68 50 82 54 94 62 C 92 66 84 68 76 66 C 68 64 62 62 58 58 Z" fill="url(#bark)" stroke="#92400e" stroke-width="2"/>
  <!-- Glowing Leyline Veins -->
  <path d="M 32 98 Q 48 72 60 52 Q 72 36 90 22" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#leyGlow)"/>
  <path d="M 60 56 Q 74 58 88 64" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#leyGlow)"/>
  <!-- Tiny arcane node crystals -->
  <circle cx="90" cy="22" r="3.5" fill="#bae6fd" filter="url(#leyGlow)"/>
  <circle cx="88" cy="64" r="3" fill="#bae6fd" filter="url(#leyGlow)"/>
</svg>