<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Outer Cog Wheel -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#bronze)" stroke-width="8"/>
  <!-- 8 Gear Teeth -->
  <g transform="translate(64,64)">
    <rect x="-6" y="-52" width="12" height="14" rx="2" fill="url(#bronze)"/>
    <rect x="-6" y="38" width="12" height="14" rx="2" fill="url(#bronze)"/>
    <rect x="-52" y="-6" width="14" height="12" rx="2" fill="url(#bronze)"/>
    <rect x="38" y="-6" width="14" height="12" rx="2" fill="url(#bronze)"/>
    <rect x="-6" y="-52" width="12" height="14" rx="2" transform="rotate(45)" fill="url(#bronze)"/>
    <rect x="-6" y="-52" width="12" height="14" rx="2" transform="rotate(135)" fill="url(#bronze)"/>
    <rect x="-6" y="-52" width="12" height="14" rx="2" transform="rotate(225)" fill="url(#bronze)"/>
    <rect x="-6" y="-52" width="12" height="14" rx="2" transform="rotate(315)" fill="url(#bronze)"/>
  </g>
  <!-- Inner Gyro Core -->
  <circle cx="64" cy="64" r="26" fill="url(#iron)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="64" cy="64" r="14" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
  <circle cx="64" cy="64" r="6" fill="#f59e0b"/>
</svg>