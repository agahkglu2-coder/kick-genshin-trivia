<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="leafAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="54" fill="url(#leafAura)"/>
  <!-- Elegant Shimmering Leaf -->
  <path d="M 28 100 C 24 64 52 32 94 18 C 96 46 82 82 46 102 C 38 106 30 106 28 100 Z" fill="url(#leafBody)" stroke="#7dd3fc" stroke-width="2.5" filter="url(#leafGlow)"/>
  <!-- Radiant Golden Veins -->
  <path d="M 32 98 Q 56 64 90 24" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 48 76 Q 64 68 76 72" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 62 54 Q 74 44 86 46" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <!-- Floating magical sparks -->
  <circle cx="98" cy="28" r="3.5" fill="#ffffff" filter="url(#leafGlow)"/>
  <circle cx="84" cy="18" r="2.5" fill="#fef08a" filter="url(#leafGlow)"/>
  <circle cx="40" cy="46" r="3" fill="#bae6fd" filter="url(#leafGlow)"/>
</svg>