<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="scrollRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rolled Scroll Cylinder -->
  <rect x="24" y="32" width="80" height="64" rx="10" transform="rotate(-25 64 64)" fill="url(#scrollRoll)" stroke="#7f1d1d" stroke-width="3"/>
  <!-- Gold Ribbons and Trim -->
  <rect x="44" y="34" width="12" height="60" rx="3" transform="rotate(-25 64 64)" fill="url(#goldRibbon)"/>
  <!-- Fiery Wax Crest Seal -->
  <circle cx="64" cy="64" r="16" fill="#b91c1c" stroke="#f59e0b" stroke-width="3" filter="url(#fireGlow)"/>
  <!-- Flaming Abyss Sigil in center -->
  <path d="M 64 54 C 60 58 56 62 58 68 C 60 74 68 76 68 70 C 68 66 64 62 64 54 Z" fill="#fef08a" filter="url(#fireGlow)"/>
  <circle cx="64" cy="65" r="3" fill="#ffffff"/>
  <!-- Hanging ribbons -->
  <path d="M 60 78 L 54 98 L 62 94 L 70 98 L 66 78 Z" fill="url(#goldRibbon)"/>
</svg>