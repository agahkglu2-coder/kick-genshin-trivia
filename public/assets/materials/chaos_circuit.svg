<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="circuitAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slatePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="56" fill="url(#circuitAura)"/>
  <!-- Octagonal Ruin Circuit Board -->
  <polygon points="40,16 88,16 112,40 112,88 88,112 40,112 16,88 16,40" fill="url(#slatePlate)" stroke="#64748b" stroke-width="3"/>
  <!-- Glowing Cyan Electronic Bus Lines -->
  <path d="M 32 32 L 56 32 L 64 48 L 64 64" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 96 32 L 72 32 L 64 48" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 32 96 L 56 96 L 64 80 L 64 64" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 96 96 L 72 96 L 64 80" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <!-- Terminal Microchips -->
  <rect x="28" y="28" width="8" height="8" fill="#f59e0b"/>
  <rect x="92" y="28" width="8" height="8" fill="#f59e0b"/>
  <rect x="28" y="92" width="8" height="8" fill="#f59e0b"/>
  <rect x="92" y="92" width="8" height="8" fill="#f59e0b"/>
  <!-- Central Arcane Microprocessor Core -->
  <circle cx="64" cy="64" r="14" fill="#090d16" stroke="#c084fc" stroke-width="2.5"/>
  <polygon points="64,54 74,64 64,74 54,64" fill="#a855f7" filter="url(#neonGlow)"/>
</svg>