<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="hellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="demonSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0505"/>
    </linearGradient>
    <linearGradient id="magmaHorns" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hellfire Background Aura -->
  <circle cx="200" cy="200" r="180" fill="url(#hellGlow)"/>

  <!-- Left Flaming Sword Hilt / Shoulder -->
  <polygon points="50,140 130,190 110,280 40,240" fill="url(#demonSkin)" stroke="#f87171" stroke-width="3"/>
  <path d="M 60 120 L 30 60 L 50 140" fill="url(#magmaHorns)" filter="url(#fireGlow)"/>

  <!-- Right Flaming Sword Hilt / Shoulder -->
  <polygon points="350,140 270,190 290,280 360,240" fill="url(#demonSkin)" stroke="#f87171" stroke-width="3"/>
  <path d="M 340 120 L 370 60 L 350 140" fill="url(#magmaHorns)" filter="url(#fireGlow)"/>

  <!-- Demon Torso & Armor -->
  <polygon points="130,210 270,210 250,370 150,370" fill="url(#demonSkin)" stroke="#ef4444" stroke-width="3"/>
  <!-- Magma Cracks -->
  <path d="M 170 230 L 190 280 L 180 320 L 200 350" stroke="#fbbf24" stroke-width="3" fill="none" filter="url(#fireGlow)"/>
  <path d="M 230 230 L 210 270 L 225 310" stroke="#f97316" stroke-width="3" fill="none" filter="url(#fireGlow)"/>

  <!-- Demon Head -->
  <polygon points="140,150 200,90 260,150 240,225 160,225" fill="url(#demonSkin)" stroke="#dc2626" stroke-width="3"/>

  <!-- Big Curving Demon Horns -->
  <!-- Left Horn -->
  <path d="M 160 135 C 130 50 60 50 50 85 C 80 110 125 150 150 155 Z" fill="url(#magmaHorns)" stroke="#fbbf24" stroke-width="2" filter="url(#fireGlow)"/>
  <!-- Right Horn -->
  <path d="M 240 135 C 270 50 340 50 350 85 C 320 110 275 150 250 155 Z" fill="url(#magmaHorns)" stroke="#fbbf24" stroke-width="2" filter="url(#fireGlow)"/>

  <!-- Glowing Fiery Eyes -->
  <ellipse cx="175" cy="165" rx="14" ry="7" transform="rotate(-15 175 165)" fill="#fbbf24" filter="url(#fireGlow)"/>
  <ellipse cx="175" cy="165" rx="6" ry="3" transform="rotate(-15 175 165)" fill="#fff"/>
  <ellipse cx="225" cy="165" rx="14" ry="7" transform="rotate(15 225 165)" fill="#fbbf24" filter="url(#fireGlow)"/>
  <ellipse cx="225" cy="165" rx="6" ry="3" transform="rotate(15 225 165)" fill="#fff"/>

  <!-- Menacing Fangs / Grin -->
  <path d="M 170 195 Q 200 215 230 195" stroke="#fbbf24" stroke-width="3" fill="none" filter="url(#fireGlow)"/>
  <polygon points="180,196 185,206 190,198" fill="#fff"/>
  <polygon points="210,198 215,206 220,196" fill="#fff"/>
  <polygon points="195,208 200,200 205,208" fill="#fff"/>

  <!-- Forehead Fiery Rune -->
  <circle cx="200" cy="130" r="12" fill="#ef4444" stroke="#fbbf24" stroke-width="2" filter="url(#fireGlow)"/>
  <polygon points="200,122 205,134 195,134" fill="#fff"/>
</svg>
